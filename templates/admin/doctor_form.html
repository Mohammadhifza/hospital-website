{% extends 'admin/base.html' %}
{% block title %}{{ 'Edit' if doctor else 'Add' }} Doctor – Admin{% endblock %}
{% block page_title %}{{ 'Edit' if doctor else 'Add' }} Doctor{% endblock %}

{% block content %}
<div class="admin-card" style="max-width:600px">
  <div class="card-header">
    <h3><i class="fas fa-{{ 'edit' if doctor else 'user-plus' }}"></i>
      {{ 'Edit Doctor' if doctor else 'Add New Doctor' }}</h3>
  </div>
  <form method="POST" style="padding:1.5rem">
    <div class="form-group">
      <label>Doctor Name <span>*</span></label>
      <input type="text" name="name" placeholder="Dr. Full Name"
             value="{{ doctor['name'] if doctor else '' }}" required/>
    </div>
    <div class="form-group">
      <label>Specialization <span>*</span></label>
      <input type="text" name="specialization" placeholder="e.g. Cardiologist"
             value="{{ doctor['specialization'] if doctor else '' }}" required/>
    </div>
    <div class="form-group">
      <label>Available Days <span>*</span></label>
      <input type="text" name="available_days" placeholder="e.g. Mon, Wed, Fri"
             value="{{ doctor['available_days'] if doctor else '' }}" required/>
    </div>
    <div class="form-actions">
      <a href="{{ url_for('admin_doctors') }}" class="btn-outline-sm">Cancel</a>
      <button type="submit" class="btn-submit">
        <i class="fas fa-save"></i> {{ 'Update' if doctor else 'Add Doctor' }}
      </button>
    </div>
  </form>
</div>
{% endblock %}
